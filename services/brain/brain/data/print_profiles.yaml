# Print profiles seed (Prompts/03-USE-CASES.md, "Tvar profilu").
# Numbers are estimates until checked against the producer spec (docs/FULFILMENT.md);
# `verified: true` marks rows already corrected from a producer.
# area_cm: [short, long] of the smallest offered size; max_area_cm: the largest.
# aspect: free (follows the image) | fixed (crop to area ratio) | panorama (long thin, outpaint allowed)
# Only profiles that need no vector/derive conversion are in phase 1.

- id: tshirt-dtg
  group: textile
  label: {cs: Tričko, en: T-shirt}
  area_cm: [30, 40]
  max_area_cm: [38, 46]
  aspect: free
  view_distance_m: 0.5
  dpi: {min: 150, target: 300}
  max_px: 5400
  output: {format: png, alpha: true, icc: sRGB}
  bleed_mm: 0
  derive: [remove-background]
  fulfilment: pod
  phase: 4
  verified: true

