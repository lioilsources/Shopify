[project]
name = "brain"
version = "0.1.0"
description = "ChatShop brain — RAG chat + ingest pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.40",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "openai>=1.60",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: integration test, needs TEST_DATABASE_URL"]

[tool.setuptools.package-data]
brain = ["data/*.yaml"]
