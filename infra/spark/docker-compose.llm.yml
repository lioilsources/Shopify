# LLM stack pro NVIDIA DGX Spark — spouštět NA Sparku:
#   docker compose -f docker-compose.llm.yml up -d
# Modely se stáhnou z HuggingFace do ./hf-cache při prvním startu.
name: chatshop-llm

services:
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model ${LLM_MODEL:-Qwen/Qwen2.5-32B-Instruct-AWQ}
      --max-model-len 16384
      --gpu-memory-utilization 0.80
    ports:
      - "8001:8000"
    volumes:
      - ./hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    command: --model-id ${EMBEDDINGS_MODEL:-BAAI/bge-m3}
    ports:
      - "8002:80"
    volumes:
      - ./hf-cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
