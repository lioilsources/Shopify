# Produkční stack pro NAS (Ubuntu + docker compose).
# Spuštění na NAS z rootu repa:
#   docker compose -f infra/nas/docker-compose.prod.yml up -d --build
# Před startem: zkopíruj .env.example -> .env (LLM_BASE_URL míří na Spark)
# a nastav doménu v infra/nas/Caddyfile.
# Zastaralé: nasazení na JODU za tunelem a CF Access přepíše plán 02, fáze 1 krok 7.
name: chatshop-prod

services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

  web:
    build: ../../apps/web
    environment:
      DATABASE_URL: postgresql://chatshop:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/chatshop
      BRAIN_URL: http://brain:8000
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      brain:
        condition: service_started
    restart: unless-stopped

  brain:
    build: ../../services/brain
    environment:
      DATABASE_URL: postgresql+psycopg://chatshop:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/chatshop
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-shop}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-shop-embed}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: chatshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: chatshop
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatshop"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  caddy-data:
  caddy-config:
